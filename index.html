<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>24H Progress</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --ink: #ffffff;
    --dim: rgba(255,255,255,0.45);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000000; --ink:#ffffff; } }
  :root[data-theme="dark"] { --bg:#000000; --ink:#ffffff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Press Start 2P", "Courier New", monospace;
    -webkit-font-smoothing: none;
    display: flex; flex-direction: column;
  }
  main {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    width: 100%; max-width: 640px; margin: 0 auto; padding: 24px 20px;
  }
  .state {
    font-size: 10px; line-height: 1.8; color: var(--dim);
    text-align: center; margin: 0 0 28px; min-height: 18px;
  }
  .state.live { color: var(--ink); }
  .pct {
    font-size: clamp(40px, 15vw, 88px);
    line-height: 1; text-align: center; margin: 0 0 28px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .pct small { font-size: 0.4em; }
  .bar {
    border: 4px solid var(--ink);
    padding: 4px; height: 44px;
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--ink);
    margin: 0 6px;
  }
  .fill { height: 100%; width: 0%; background: var(--ink); }
  .ticks {
    display: flex; justify-content: space-between;
    font-size: 8px; color: var(--dim); margin: 18px 6px 0;
  }
  .clear { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .clear { animation: none; } }

  footer {
    width: 100%; max-width: 640px; margin: 0 auto;
    padding: 16px 20px 24px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 9px;
  }
  footer label { color: var(--dim); }
  input[type="date"] {
    font: inherit; font-size: 11px;
    background: var(--bg); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 0;
    padding: 8px 10px; -webkit-appearance: none; appearance: none;
    min-height: 38px;
  }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  input:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="state" id="state">&nbsp;</p>
  <div class="pct" id="pct" aria-live="off">0.00<small>%</small></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
    <div class="fill" id="fill"></div>
  </div>
  <div class="ticks"><span id="t0">08:30</span><span>50</span><span id="t1">08:30</span></div>
</main>
<footer>
  <label for="date">Start</label>
  <input type="date" id="date">
</footer>

<script>
(function () {
  var KEY = "progress-timer-date";
  var dateEl = document.getElementById("date");
  var pctEl = document.getElementById("pct");
  var fillEl = document.getElementById("fill");
  var barEl = document.getElementById("bar");
  var stateEl = document.getElementById("state");
  var t0 = document.getElementById("t0");
  var t1 = document.getElementById("t1");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function toISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function short(d) { return pad(d.getMonth() + 1) + "." + pad(d.getDate()); }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  dateEl.value = saved || toISO(new Date());

  dateEl.addEventListener("change", function () {
    try { localStorage.setItem(KEY, dateEl.value); } catch (e) {}
    tick();
  });

  function bounds() {
    var p = (dateEl.value || toISO(new Date())).split("-").map(Number);
    var start = new Date(p[0], p[1] - 1, p[2], 8, 30, 0, 0);
    var end = new Date(p[0], p[1] - 1, p[2] + 1, 8, 30, 0, 0);
    return { start: start, end: end };
  }

  function tick() {
    var b = bounds();
    var now = Date.now();
    var total = b.end - b.start;
    var ratio = (now - b.start) / total;
    ratio = Math.max(0, Math.min(1, ratio));
    var pct = ratio * 100;

    pctEl.innerHTML = pct.toFixed(2) + "<small>%</small>";
    fillEl.style.width = pct + "%";
    barEl.setAttribute("aria-valuenow", pct.toFixed(0));
    t0.textContent = short(b.start);
    t1.textContent = short(b.end);

    stateEl.classList.remove("live", "clear");
    if (now < b.start) {
      stateEl.textContent = "Starts " + short(b.start) + " 08:30";
    } else if (now < b.end) {
      stateEl.textContent = "Running";
      stateEl.classList.add("live");
    } else {
      stateEl.textContent = "Complete!";
      stateEl.classList.add("live", "clear");
    }
  }

  tick();
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", tick);
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
